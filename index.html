<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malafaareh</title>
    <!-- Fonts: Cormorant Garamond (serif headings) + Inter (body/UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind is compiled via PostCSS; styles imported in index.tsx -->
    <style>
      :root {
        --color-bg: #FAF8F5; /* porcelain */
        --color-text: #1C1C1C; /* charcoal */
        --color-muted: #6C6C6C;
        --color-accent: #0F3D3E; /* cypress green */
        --shadow-soft: 0 8px 24px rgba(0,0,0,0.06);
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      /* Base typography and headings letterspacing */
      h1, h2 { letter-spacing: -0.02em; }
      h3, h4 { letter-spacing: -0.01em; }

      .btn-primary {
        background: var(--color-accent);
        color: #FFFFFF;
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        box-shadow: var(--shadow-soft);
        transition: transform 150ms var(--ease, cubic-bezier(0.22, 1, 0.36, 1)), opacity 150ms;
      }
      .btn-primary:hover { transform: translateY(-1px) scale(1.02); filter: saturate(1.1); }
      .btn-secondary {
        background: #FFFFFF;
        color: var(--color-accent);
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        border: 1px solid rgba(15,61,62,0.18);
        box-shadow: var(--shadow-soft);
        transition: transform 150ms var(--ease, cubic-bezier(0.22, 1, 0.36, 1)), background-color 150ms, color 150ms, border-color 150ms;
      }
      .btn-secondary:hover {
        transform: translateY(-1px) scale(1.02);
        background-color: rgba(15,61,62,0.06);
        border-color: rgba(15,61,62,0.28);
      }
      .btn-outline {
        background: transparent;
        color: #FFFFFF;
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        border: 1px solid rgba(255,255,255,0.7);
        transition: background-color 150ms, color 150ms, border-color 150ms, transform 150ms var(--ease, cubic-bezier(0.22, 1, 0.36, 1));
      }
      .btn-outline:hover {
        transform: translateY(-1px) scale(1.02);
        background-color: rgba(255,255,255,0.12);
        border-color: rgba(255,255,255,0.9);
      }
      .btn-link { color: var(--color-accent); }
      .shimmer {
        position: relative;
        overflow: hidden;
      }
      .shimmer::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(110deg, transparent 0%, rgba(255,255,255,0.35) 30%, transparent 60%);
        transform: translateX(-100%);
        transition: transform 450ms cubic-bezier(0.22,1,0.36,1);
      }
      .shimmer:hover::after { transform: translateX(0%); }
      /* Focus states: soft ring using accent */
      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      [role="button"]:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(15, 61, 62, 0.35);
        border-radius: 8px;
      }
      @keyframes shake-cart {
        10%, 90% { transform: translate3d(-0.5px, 0, 0) rotate(-3deg); }
        20%, 80% { transform: translate3d(1px, 0, 0) rotate(3deg); }
        30%, 50%, 70% { transform: translate3d(-2px, 0, 0) rotate(-3deg); }
        40%, 60% { transform: translate3d(2px, 0, 0) rotate(3deg); }
      }
      .cart-shake {
        animation: shake-cart 0.6s cubic-bezier(.36,.07,.19,.97) both;
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }
        /* Elevate accents subtly; avoid glossy effects */
      /* Motion reduction support */
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
</head>
  <body class="bg-porcelain text-charcoal font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
