# Cloud Build configuration for building and deploying the Luxe API + static frontend
# Substitutions:
#   _REGION, _RUN_REGION, _PROJECT_ID, _REPO, _SERVICE_NAME, _IMAGE_TAG, _RUN_TESTS,
#   _RUN_MIGRATIONS, _DEPLOY_STATIC, _STATIC_BUCKET

substitutions:
  _REGION: "europe-west1"
  _RUN_REGION: "europe-west1"
  _SERVICE_NAME: "luxe-modern-ecommerce-api"
  _REPO: "luxe-repo"
  _PROJECT_ID: "malafaareh-481713"
  _IMAGE_TAG: "latest"
  _RUN_TESTS: "true"
  _RUN_MIGRATIONS: "false"
  _DEPLOY_STATIC: "false"
  _STATIC_BUCKET: ""
  _DEPLOY_CLOUD_RUN: "false"
  _REVISION_TAG: "${SHORT_SHA}"  # Use commit SHA as revision tag
  _TRAFFIC_PERCENT: "100"         # Default to 100% for new deployments
  _ENABLE_TRAFFIC_SPLIT: "false"  # Enable traffic splitting for blue-green deployments

options:
  substitutionOption: ALLOW_LOOSE
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Configure gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud config set project $_PROJECT_ID
        gcloud config set run/platform managed
        gcloud config set run/region ${_RUN_REGION:-$_REGION}
        gcloud --version
  - name: 'node:20'
    id: 'Install deps'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Installing dependencies via npm install" && npm install --no-audit --no-fund

  - name: 'node:20'
    id: 'Run unit tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$_RUN_TESTS" = "true" ]; then
          npm run test
        else
          echo "Skipping unit tests"
        fi

  - name: 'node:20'
    id: 'Run smoke tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$_RUN_TESTS" = "true" ]; then
          npm run test -- tests/smoke_cart.spec.ts
        else
          echo "Skipping smoke tests"
        fi

  - name: 'node:20'
    id: 'Build client bundle'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm run build:client

  - name: 'node:20'
    id: 'Build server bundle'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm run build:server

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Sync static assets'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$_DEPLOY_STATIC" = "true" ] && [ -n "$_STATIC_BUCKET" ]; then
          echo "Uploading SPA to gs://$_STATIC_BUCKET"
          gsutil -m rsync -r dist/client gs://$_STATIC_BUCKET
        else
          echo "Skipping static upload"
        fi

  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'Build & push image'
    env:
      - 'DOCKER_CONFIG=/workspace/.docker/'
    args:
      - '--context=.'
      - '--dockerfile=./Dockerfile'
      - '--destination=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_REPO/$_SERVICE_NAME:$_IMAGE_TAG'
      - '--cache=true'
      - '--cache-ttl=48h'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Run migrations'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$_RUN_MIGRATIONS" = "true" ]; then
          echo "Running migrations via Cloud SQL connector"
          export DATABASE_URL="$(gcloud secrets versions access latest --secret=DATABASE_URL --project=$_PROJECT_ID)"
          node dist/scripts/migrate.js
        else
          echo "Skipping DB migrations"
        fi

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Cloud Run'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$_DEPLOY_CLOUD_RUN" = "true" ]; then
          # Deploy with revision tag
          gcloud run deploy $_SERVICE_NAME \
            --image $_REGION-docker.pkg.dev/$_PROJECT_ID/$_REPO/$_SERVICE_NAME:$_IMAGE_TAG \
            --region ${_RUN_REGION:-$_REGION} \
            --platform managed \
            --no-allow-unauthenticated \
            --service-account=cloud-run-runtime@$_PROJECT_ID.iam.gserviceaccount.com \
            --impersonate-service-account=cloud-run-runtime@$_PROJECT_ID.iam.gserviceaccount.com \
            --concurrency=80 \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=5 \
            --set-env-vars=NODE_ENV=production \
            --project $_PROJECT_ID \
            --tag $_REVISION_TAG \
            --no-traffic \
            --quiet
          
          # Apply traffic split if enabled
          if [ "$_ENABLE_TRAFFIC_SPLIT" = "true" ]; then
            echo "Applying traffic split: ${_TRAFFIC_PERCENT}% to new revision"
            gcloud run services update-traffic $_SERVICE_NAME \
              --region ${_RUN_REGION:-$_REGION} \
              --to-tags ${_REVISION_TAG}=${_TRAFFIC_PERCENT}
          else
            echo "Routing 100% traffic to latest revision"
            gcloud run services update-traffic $_SERVICE_NAME \
              --region ${_RUN_REGION:-$_REGION} \
              --to-latest
          fi
        else
          echo "Skipping Cloud Run deploy"
        fi

