# Cloud Build configuration for building and deploying the Next.js web frontend
# Substitutions:
#   _REGION, _RUN_REGION, _PROJECT_ID, _REPO, _SERVICE_NAME, _IMAGE_TAG, _DEPLOY_CLOUD_RUN

substitutions:
  _REGION: "europe-west1"
  _RUN_REGION: "europe-west1"
  _SERVICE_NAME: "luxe-modern-ecommerce-web"
  _REPO: "luxe-repo"
  _PROJECT_ID: "malafaareh-481713"
  _IMAGE_TAG: "latest"
  _DEPLOY_CLOUD_RUN: "false"

options:
  substitutionOption: ALLOW_LOOSE
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Configure gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud config set project $_PROJECT_ID
        gcloud config set run/platform managed
        gcloud config set run/region ${_RUN_REGION:-$_REGION}
        gcloud --version

  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'Build & push web image'
    env:
      - 'DOCKER_CONFIG=/workspace/.docker/'
    args:
      - '--context=.'
      - '--dockerfile=./Dockerfile.web'
      - '--destination=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_REPO/$_SERVICE_NAME:$_IMAGE_TAG'
      - '--cache=true'
      - '--cache-ttl=48h'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Cloud Run (web)'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$_DEPLOY_CLOUD_RUN" = "true" ]; then
          gcloud run deploy $_SERVICE_NAME \
            --image $_REGION-docker.pkg.dev/$_PROJECT_ID/$_REPO/$_SERVICE_NAME:$_IMAGE_TAG \
            --region ${_RUN_REGION:-$_REGION} \
            --platform managed \
            --allow-unauthenticated \
            --concurrency=80 \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=5 \
            --set-env-vars=NODE_ENV=production \
            --project $_PROJECT_ID \
            --quiet
        else
          echo "Skipping Cloud Run deploy"
        fi
